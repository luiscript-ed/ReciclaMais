<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabéns!</title>
    <link rel="icon" type="image/png" href="../logo.jpeg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: sans-serif;
            overflow: hidden; /* Garante que não haverá barra de rolagem */
            display: flex;
            background-color: #f4fdfb; /* Fundo geral verde-água bem claro */
        }

        /* Div da Esquerda (Imagem) */
        .esquerda {
            width: 50%;
            height: 100%;
            background-color: #00b386; /* Verde-água escuro para contraste */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .esquerda img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
            border-radius: 8px;
        }

        /* Div da Direita (Texto) */
        .direita {
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10%;
            color: #004d36; /* Texto em tom verde-água escuro */
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #10b67f; /* Título principal em destaque verde-água */
        }

        h3 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: normal;
        }

        p {
            font-size: 1rem;
            color: #666;
        }
    </style>
</head>
<body>

    <!-- Metade Esquerda -->
    <div class="esquerda">
        <!-- Substitua o link abaixo pela URL da sua imagem -->
        <img src="logoGrande.png" alt="Imagem de celebração">
    </div>

    <!-- Metade Direita -->
    <div class="direita">
        <h1 id="mensagemH1"></h1>
        <h3 id="mensagemH3"></h3>
        <p>Você está sendo direcionado em 3 segundos.</p>
    </div>
<script src="qrcode.js"></script>
</body>
</html>
